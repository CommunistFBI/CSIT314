<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalentMatch — Sign In</title>
  <link rel="stylesheet" href="/styles/app.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">TalentMatch</div>
    <p class="auth-tagline">Intelligent Talent Matching Platform</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">Register</button>
    </div>

    <div id="alertBox"></div>

    <!-- LOGIN -->
    <div id="loginSection">
      <div class="form-row cols-1" style="margin-bottom:14px">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
        </div>
      </div>
      <div class="form-row cols-1" style="margin-bottom:20px">
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
        </div>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="doLogin()">Sign In</button>
    </div>

    <!-- REGISTER -->
    <div id="registerSection" style="display:none">
      <div class="form-row cols-1" style="margin-bottom:14px">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email">
        </div>
      </div>
      <div class="form-row cols-1" style="margin-bottom:14px">
        <div class="form-group">
          <label>Password <span class="hint">(min 6 characters)</span></label>
          <input type="password" id="regPassword" placeholder="••••••••" autocomplete="new-password">
        </div>
      </div>
      <div class="form-row cols-1" style="margin-bottom:20px">
        <div class="form-group">
          <label>I am a...</label>
          <select id="regRole">
            <option value="candidate">Job Seeker (Candidate)</option>
            <option value="employer">Employer</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="doRegister()">Create Account</button>
    </div>
  </div>
</div>

<script>
  try {
    const u = JSON.parse(localStorage.getItem('tm_user'));
    if (u && u.id) window.location.href = u.role === 'candidate' ? '/candidate.html' : '/employer.html';
  } catch {}

  function switchTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('tabLogin').classList.toggle('active', isLogin);
    document.getElementById('tabRegister').classList.toggle('active', !isLogin);
    document.getElementById('loginSection').style.display = isLogin ? 'block' : 'none';
    document.getElementById('registerSection').style.display = isLogin ? 'none' : 'block';
    document.getElementById('alertBox').innerHTML = '';
  }

  function showAlert(msg, type = 'error') {
    document.getElementById('alertBox').innerHTML =
      `<div class="alert alert-${type}">${msg}</div>`;
  }

  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) return showAlert('Email and password are required.');
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!data.success) return showAlert(data.message);
      localStorage.setItem('tm_user', JSON.stringify(data.data));
      window.location.href = data.data.role === 'candidate' ? '/candidate.html' : '/employer.html';
    } catch {
      showAlert('Network error — is the server running on port 5000?');
    }
  }

  async function doRegister() {
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const role = document.getElementById('regRole').value;
    if (!email || !password) return showAlert('All fields are required.');
    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, role })
      });
      const data = await res.json();
      if (!data.success) return showAlert(data.message);
      showAlert('Account created! Signing you in...', 'success');
      setTimeout(() => {
        localStorage.setItem('tm_user', JSON.stringify(data.data));
        window.location.href = data.data.role === 'candidate' ? '/candidate.html' : '/employer.html';
      }, 800);
    } catch {
      showAlert('Network error — is the server running on port 5000?');
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const isLogin = document.getElementById('loginSection').style.display !== 'none';
    if (isLogin) doLogin(); else doRegister();
  });
</script>
</body>
</html>
