<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth API Test</title>
  <link rel="stylesheet" href="/styles/test-pages.css" />
</head>
<body>
  <div class="container">
    <div class="page-header">
      <div>
        <h1>Login / Register Test</h1>
        <p class="subtitle">Simple auth test page with account type included for workflow testing.</p>
      </div>
      <a class="nav-link" href="/index.html">All Test Pages</a>
    </div>

    <div class="grid two-col">
      <section class="card">
        <h2>Register</h2>
        <form id="registerForm">
          <input type="email" name="email" placeholder="Email" required />
          <input type="password" name="password" placeholder="Password" required />
          <select name="role" required>
            <option value="">Choose account type</option>
            <option value="candidate">Candidate</option>
            <option value="employer">Employer</option>
          </select>
          <select name="isMember">
            <option value="false">Non-membership</option>
            <option value="true">Membership</option>
          </select>
          <button type="submit">Register User</button>
        </form>
      </section>

      <section class="card">
        <h2>Login</h2>
        <form id="loginForm">
          <input type="email" name="email" placeholder="Email" required />
          <input type="password" name="password" placeholder="Password" required />
          <button type="submit">Login User</button>
        </form>
      </section>
    </div>

    <section class="card">
      <div class="section-header">
        <h2>Registered Users</h2>
        <button id="loadUsersBtn" type="button" class="secondary-btn">Load Users</button>
      </div>
      <pre id="authOutput">Waiting...</pre>
    </section>
  </div>

  <script src="/js/auth-test.js"></script>
</body>
</html>
