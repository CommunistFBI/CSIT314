<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candidate API Test</title>
  <link rel="stylesheet" href="/styles/test-pages.css" />
</head>
<body>
  <div class="container">
    <div class="page-header">
      <div>
        <h1>Candidate Testing Page</h1>
        <p class="subtitle">Manual candidate profile test page. Use a candidate userId from auth first.</p>
      </div>
      <a class="nav-link" href="/index.html">All Test Pages</a>
    </div>

    <div class="card">
      <h2>Create Candidate</h2>
      <form id="candidateForm">
        <input type="text" name="userId" placeholder="Candidate userId" required />
        <input type="text" name="fullName" placeholder="Full name" required />
        <input type="text" name="contactInformation" placeholder="Contact information" required />
        <input type="text" name="education" placeholder="Education" required />
        <input type="text" name="major" placeholder="Major / field of study" required />
        <input type="number" name="yearsOfExperience" placeholder="Years of experience" required />
        <textarea name="workExperience" placeholder="Work experience summary" rows="4" required></textarea>
        <input type="text" name="skills" placeholder="Skills (comma separated)" required />
        <select name="preferredWorkingMode" required>
          <option value="">Preferred working mode</option>
          <option value="Remote">Remote</option>
          <option value="On-site">On-site</option>
          <option value="Hybrid">Hybrid</option>
        </select>
        <input type="text" name="preferredLocation" placeholder="Preferred location" required />
        <input type="text" name="preferences" placeholder="Preferences (comma separated)" />
        <label>Resume</label>
        <input type="file" name="resume" />
        <label>Cover letter</label>
        <input type="file" name="coverLetter" />
        <label>Profile image</label>
        <input type="file" name="profileImage" accept="image/*" />
        <button type="submit">Submit Candidate</button>
      </form>
    </div>

    <div class="card">
      <h2>All Candidates</h2>
      <button id="loadCandidates">Load Candidates</button>
      <pre id="candidateOutput">Waiting...</pre>
    </div>
  </div>

  <script src="/js/candidate-test.js"></script>
</body>
</html>
