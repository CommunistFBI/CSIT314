<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recommendations Test</title>
  <link rel="stylesheet" href="/styles/test-pages.css" />
</head>
<body>
  <div class="container">
    <div class="page-header">
      <div>
        <h1>Recommendation Testing Page</h1>
        <p class="subtitle">Direct endpoint testing for recommendation routes using saved IDs.</p>
      </div>
      <a class="nav-link" href="/index.html">All Test Pages</a>
    </div>

    <p>First load jobs and candidates, then copy an ID into the relevant field below.</p>

    <div class="grid two-col">
      <div class="card">
        <h2>Top Jobs for Candidate</h2>
        <input id="candidateId" placeholder="Candidate ID" />
        <button id="candidateRecBtn">Get Recommended Jobs</button>
        <pre id="candidateRecOutput">Waiting...</pre>
      </div>

      <div class="card">
        <h2>Top Candidates for Job</h2>
        <input id="jobId" placeholder="Job ID" />
        <button id="jobRecBtn">Get Recommended Candidates</button>
        <pre id="jobRecOutput">Waiting...</pre>
      </div>
    </div>
  </div>

  <script src="/js/recommendations-test.js"></script>
</body>
</html>
